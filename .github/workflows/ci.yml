name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'integrate/*'
      - 'sprint/*'
      - 'fix/*'
      - 'feature/**'

# The app ships macOS, Windows, and Linux builds, and several code paths
# (extended PATH, attachment path guards, CREATE_NO_WINDOW) are
# platform-specific, so the same gates run on all three runners.
jobs:
  version-sync:
    name: version sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version and toolchain pins agree
        run: python3 scripts/check_version_sync.py

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm test

      - name: Type check
        run: npx vue-tsc --noEmit

  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Keep in sync with rust-toolchain.toml (enforced by the version-sync job).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo test
        run: cargo test --workspace

  rust-quality:
    name: rust quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep in sync with rust-toolchain.toml (enforced by the version-sync job).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check -p btit-types

      - name: Clippy
        run: cargo clippy -p btit-types --all-targets -- -D warnings

      - name: Rustdoc missing-docs
        run: cargo rustdoc -p btit-types -- -D missing-docs

      # Data-only crate: dependency graph gate, host-independent so it runs once, on Linux.
      - name: Dependency graph
        if: runner.os == 'Linux'
        shell: bash
        run: cargo tree -e normal -p btit-types --depth 1 --prefix none --format '{p}' | sed -E 's/ v.*//' | sort | diff - <(printf 'btit-types\nserde\nserde_json\n')

  crates:
    name: crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep in sync with rust-toolchain.toml (enforced by the version-sync job).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check -p sc-observability-log -p sc-observability-log-macros -p sc-observability-log-consumer-check

      - name: Clippy
        run: cargo clippy --locked -p sc-observability-log -p sc-observability-log-macros -p sc-observability-log-consumer-check --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked -p sc-observability-log -p sc-observability-log-macros -p sc-observability-log-consumer-check

      # The remaining steps are host-independent, so they run once, on Linux, in bash.
      # CARGO_TERM_COLOR=always (set by the toolchain/cache actions) colors cargo tree's
      # `(*)` marker, which the sed filter would then miss.
      - name: Runtime dependency graph
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: cargo tree --locked -p sc-observability-log -e normal --target all --prefix none --format '{p}' | sed -E 's/ \(.*$//' | LC_ALL=C sort -u | diff - crates/runtime-deps.txt

      - name: Test-isolation contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for f in crates/sc-observability-log*/tests/*.rs; do if grep -qE '\binit\(' "$f"; then n=$(grep -cE '#\[([A-Za-z_]+::)*test\b' "$f"); [ "$n" -eq 1 ] || { echo "isolation violation: $f has $n test fns"; exit 1; }; fi; done

      - name: Rustdoc missing-docs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo rustdoc --locked -p sc-observability-log -- -D missing-docs
          cargo rustdoc --locked -p sc-observability-log-macros -- -D missing-docs

      # The MSRV toolchain is installed with rustup rather than a workflow `toolchain` key:
      # scripts/check_version_sync.py:142-148 requires every such key to equal rust-toolchain.toml.
      # The three in-tree crates are selected with -p, not --workspace: btit-app requires 1.98.1.
      - name: MSRV check (1.94.1)
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.94.1 --profile minimal --no-self-update
          cargo +1.94.1 check --locked -p sc-observability-log -p sc-observability-log-macros -p sc-observability-log-consumer-check --all-targets
