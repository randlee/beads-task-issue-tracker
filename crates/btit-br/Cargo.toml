[package]
name = "btit-br"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "br (beads_rust) backend: BeadsBackend, CliBackend, CloseSuggestions."
publish = false

[dependencies]
btit-types = { path = "../btit-types" }
btit-beads = { path = "../btit-beads" }
btit-cli = { path = "../btit-cli" }
serde_json.workspace = true
log.workspace = true

[features]
test-support = ["btit-cli/test-support"]   # enables BrCli::with_invoker for this crate's and the app's tests

[dev-dependencies]
btit-cli = { path = "../btit-cli", features = ["test-support"] }

[lints]
workspace = true
