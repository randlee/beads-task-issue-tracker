[workspace]
members = [
    "sc-observability-log",
    "sc-observability-log-macros",
    "sc-observability-log-consumer-check",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"

[workspace.dependencies]
sc-observability = "1.2.0"
sc-observability-types = "1.2.0"
log = { version = "0.4", features = ["std", "kv"] }   # `std` enables log::set_boxed_logger (cfg(feature = "alloc") in log-0.4.34)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hostname = "0.4"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tempfile = "3"
trybuild = "1"   # dev-only: compile-fail UI tests for the rejected macro forms
tracing = "0.1" # dev-only: proves the compatibility fixture is genuine tracing syntax
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] } # dev-only: async #[instrument] tests
sc-observability-log-macros = { version = "=0.1.0", path = "sc-observability-log-macros" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
