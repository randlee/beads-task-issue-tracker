# Pinned Rust toolchain (repo root, applies to every workspace crate and to the Tauri CLI).
# Keep in sync with `rust-version` in Cargo.toml and the `toolchain:` pins in
# .github/workflows/*.yml — `python3 scripts/check_version_sync.py` enforces this.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
