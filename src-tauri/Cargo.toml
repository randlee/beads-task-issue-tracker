# Workspace root. `[workspace.package].version` is the single source of truth for
# the app version: tauri.conf.json omits `version` (Tauri falls back to this crate's
# version) and package.json mirrors it (checked by scripts/check_version_sync.py).
# Future crates split out of this one should use `version.workspace = true` etc.
[workspace]
resolver = "2"

[workspace.package]
version = "1.24.5"
authors = ["Laurent Chapin <laurent.chapin@w3dev.fr>"]
license = "MIT"
repository = ""
edition = "2021"
# Matches rust-toolchain.toml (repo root).
rust-version = "1.98.1"

[package]
name = "beads-issue-tracker"
version.workspace = true
description = "Beads Task-Issue Tracker - Desktop app for managing bd Beads issues"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = { version = "0.4", features = ["kv"] }
sc-observability-log = { path = "../crates/sc-observability-log" }
tauri = { version = "2.9.5", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
dirs = "6.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
notify = "7.0"
notify-debouncer-mini = "0.5"
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
