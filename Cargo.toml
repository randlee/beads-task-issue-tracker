# Workspace root. `[workspace.package].version` is the single source of truth for
# the app version: crates/btit-app/tauri.conf.json omits `version` (Tauri falls back
# to the app crate's version) and package.json mirrors it (checked by
# scripts/check_version_sync.py). The in-tree sc-observability-log* crates keep their
# own version and are exempt from that check.
[workspace]
members = [
    "crates/btit-app",   # b-2..b-6 append btit-types, btit-beads, btit-cli, btit-bd, btit-br
    "crates/sc-observability-log",                 # phase-a crates, in-tree at 0.1.0 (OQ-3 resolved)
    "crates/sc-observability-log-macros",
    "crates/sc-observability-log-consumer-check",
]
resolver = "2"

[workspace.package]
version = "1.24.5"                       # single source of truth (ADR-003); scripts/check_version_sync.py --set bumps it
authors = ["Laurent Chapin <laurent.chapin@w3dev.fr>"]
license = "MIT"
repository = ""
edition = "2021"                         # OQ-1
rust-version = "1.98.1"                  # equals rust-toolchain.toml channel (ADR-004)

[workspace.dependencies]
# app (crates/btit-app)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `std` enables log::set_boxed_logger (cfg(feature = "alloc") in log-0.4.34); `kv` is used by the app and the bridge.
log = { version = "0.4", features = ["std", "kv"] }
sc-observability-log = { path = "crates/sc-observability-log" }   # in-tree for all of phase-b (OQ-3)
tauri = { version = "2.9.5", features = [] }
tauri-build = { version = "2.5.3", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
dirs = "6.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
notify = "7.0"
notify-debouncer-mini = "0.5"
dotenvy = "0.15"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }   # dev-only; union of the app and phase-a feature lists
# phase-a crates (moved verbatim from the former crates/ workspace; paths re-rooted)
sc-observability = "1.2.0"
sc-observability-types = "1.2.0"
thiserror = "2"
hostname = "0.4"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tempfile = "3"
trybuild = "1"   # dev-only: compile-fail UI tests for the rejected macro forms
tracing = "0.1" # dev-only: proves the compatibility fixture is genuine tracing syntax
sc-observability-log-macros = { version = "=0.1.0", path = "crates/sc-observability-log-macros" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
